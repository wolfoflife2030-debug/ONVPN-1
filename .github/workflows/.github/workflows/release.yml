name: On Vpn Release (Android APK + Windows EXE)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build installable APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OnVPN-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OnVPN-Android
          path: OnVPN-Android.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        working-directory: windows
        run: >
          dotnet publish OnVpn.Client/OnVpn.Client.csproj -c Release -r win-x64
          --self-contained true -p:Platform=x64 -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path windows/publish/* -DestinationPath OnVPN-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OnVPN-Windows
          path: OnVPN-Windows-x64.zip
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          gh release create "$TAG" dist/* --title "On Vpn $TAG" --generate-notes --prerelease
